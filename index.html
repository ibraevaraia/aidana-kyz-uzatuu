<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080706">

<title>Айдана — Кыз узатуу</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080706;
}

body {
  font-family: 'Manrope', sans-serif;
  color: white;
}

.invitation {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 600px;
  overflow: hidden;
  background: #080706;
}

/* СҮРӨТТӨР */

.photo {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center center;
  opacity: 0;
  transition: opacity 1.8s ease;
}

.photo.active {
  opacity: 1;
}

#photoA {
  background-image: url('./C324E1C4-7ACD-416E-8458-CB22A9206F98.png');
}

#photoB {
  background-image: url('./IMG_7451.jpeg');
}

/* КАРА ПАНЕЛЬ ЖОК */

/* ҮСТҮҢКҮ ЖАЗУУ */

.top-mark {
  position: absolute;
  top: 7%;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  z-index: 3;
}

.top-mark span {
  font-size: 9px;
  letter-spacing: 3px;
  color: #f2dfbd;
  text-shadow: 0 2px 8px black;
}

.top-mark .line {
  width: 30px;
  height: 1px;
  background: #d8bd8e;
}

/* ТЕКСТ */

.text-panel {
  position: absolute;
  left: 7%;
  right: 7%;
  top: 68%;
  transform: translateY(-50%);
  padding: 15px 10px;
  text-align: center;

  background: transparent;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;

  z-index: 3;
  opacity: 0;
  transition: opacity 1s ease;
}

.text-panel.show {
  opacity: 1;
}

.eyebrow {
  font-size: 9px;
  letter-spacing: 3px;
  color: #f2dfbd;
  margin-bottom: 15px;
  text-shadow: 0 2px 10px black;
}

.slide-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(32px, 8vw, 45px);
  font-weight: 500;
  line-height: 1.1;
  color: #f2dfbd;
  margin-bottom: 16px;
  text-shadow: 0 2px 12px rgba(0,0,0,.9);
}

.slide-copy {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(19px, 5vw, 24px);
  line-height: 1.5;
  color: #fffaf1;
  text-shadow: 0 2px 12px rgba(0,0,0,.95);
}

.panel-bottom {
  margin-top: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.panel-bottom span {
  color: #f2dfbd;
  text-shadow: 0 2px 10px black;
}

.panel-name {
  font-size: 11px;
  letter-spacing: 5px;
}

/* ТӨМӨНКҮ ЖАЗУУ */

.footer-note {
  position: absolute;
  bottom: 7%;
  left: 8%;
  right: 8%;
  text-align: center;
  font-size: 8px;
  line-height: 1.8;
  letter-spacing: 2px;
  color: white;
  text-shadow: 0 2px 10px black;
  z-index: 3;
}

/* ҮН БАСКЫЧЫ */

.sound-start {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: 15%;
  transform: translateX(-50%);
  padding: 15px 26px;
  border: 1px solid #d8bd8e;
  background: rgba(15,12,9,.8);
  color: #f5e4c4;
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  letter-spacing: 1px;
  white-space: nowrap;
  cursor: pointer;
}

.sound-start.hidden {
  display: none;
}

.sound-toggle {
  position: absolute;
  z-index: 5;
  top: 5%;
  right: 6%;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid #d8bd8e;
  background: rgba(0,0,0,.5);
  color: #f5e4c4;
  font-size: 17px;
}

.progress {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,.15);
  z-index: 5;
}

.progress span {
  display: block;
  width: 0%;
  height: 100%;
  background: #d8bd8e;
}

@media (max-height: 700px) {
  .text-panel {
    top: 65%;
    padding: 10px;
  }

  .slide-title {
    margin-bottom: 10px;
  }

  .panel-bottom {
    margin-top: 12px;
  }
}
</style>
</head>

<body>

<main class="invitation">

  <div class="photo active" id="photoA"></div>
  <div class="photo" id="photoB"></div>

  <div class="top-mark">
    <span class="line"></span>
    <span>АК ТИЛЕК • АК БАТА • АК ЖОЛ</span>
    <span class="line"></span>
  </div>

  <section class="text-panel" id="panel">

    <p class="eyebrow" id="eyebrow">
      КЫЗ УЗАТУУ САЛТАНАТЫ
    </p>

    <h1 class="slide-title" id="title">
      Ак тилек
    </h1>

    <p class="slide-copy" id="copy">
      Кыз узатуу — ак баталар айтылып,
      жакшы тилектер арналып,
      жаңы жашоого ак жол кааланган өзгөчө күн.
    </p>

    <div class="panel-bottom">
      <span>✧</span>
      <span class="panel-name">АЙДАНА</span>
      <span>✧</span>
    </div>

  </section>

  <button class="sound-start" id="startButton">
    ♫ &nbsp; ҮН МЕНЕН КӨРҮҮ
  </button>

  <button class="sound-toggle" id="soundToggle" hidden>
    ♫
  </button>

  <div class="footer-note">
    СИЗДЕРДИ КУБАНЫЧЫБЫЗГА ОРТОКТОШ БОЛУУГА ЧАКЫРАБЫЗ
  </div>

  <div class="progress">
    <span id="progressBar"></span>
  </div>

  <audio id="narration" preload="auto"
    src="./ElevenLabs_Untitled_project.mp3"></audio>

  <audio id="music" preload="auto" loop
    src="./kyz_uzatuu_music.mp3"></audio>

</main>

<script>

const slides = [
  {
    start: 0,
    end: 8,
    title: "Ак тилек",
    text: "Кыз узатуу — ак баталар айтылып, жакшы тилектер арналып, жаңы жашоого ак жол кааланган өзгөчө күн."
  },
  {
    start: 8,
    end: 17,
    title: "Кубанычтуу күн",
    text: "Урматтуу туугандар, куда-сөөктөр, кадырлуу коноктор! Сиздерди кызыбыз Айдананын кыз узатуу салтанатына чакырабыз."
  },
  {
    start: 17,
    end: 24,
    title: "Айдана",
    text: "Бул кубанычтуу күнү биздин бактыбызды тең бөлүшүп, ак тилегиңиздерди арнап, төрүбүздүн көркү болуңуздар."
  },
  {
    start: 24,
    end: 32,
    title: "Каракол шаары",
    text: "Салтанатыбыз Каракол шаарында, «Соно» ресторанында өтөт."
  },
  {
    start: 32,
    end: 40,
    title: "3-март, 2027-жыл",
    text: "Сиздерди 2027-жылдын 3-март күнү, саат 15:00дө күтөбүз."
  },
  {
    start: 40,
    end: 47.36,
    title: "Ак жол, Айдана!",
    text: "Урматтоо менен, Муратбек жана Гүлгаакы. Келишиңиздерди чыдамсыздык менен күтөбүз!"
  }
];

const narration = document.getElementById("narration");
const music = document.getElementById("music");
const panel = document.getElementById("panel");
const title = document.getElementById("title");
const copy = document.getElementById("copy");

const startButton = document.getElementById("startButton");
const soundToggle = document.getElementById("soundToggle");
const progressBar = document.getElementById("progressBar");

let currentSlide = -1;
let photoAActive = true;
let started = false;

function showSlide(index) {

  if (index === currentSlide) return;

  currentSlide = index;

  panel.classList.remove("show");

  setTimeout(() => {

    title.textContent = slides[index].title;
    copy.textContent = slides[index].text;

    panel.classList.add("show");

    photoAActive = !photoAActive;

    document.getElementById("photoA")
      .classList.toggle("active", photoAActive);

    document.getElementById("photoB")
      .classList.toggle("active", !photoAActive);

  }, 500);
}

function update() {

  if (!started) return;

  const time = narration.currentTime;

  const index = slides.findIndex(slide =>
    time >= slide.start && time < slide.end
  );

  if (index !== -1) {
    showSlide(index);
  }

  const duration = narration.duration || 47.36;

  progressBar.style.width =
    Math.min(100, time / duration * 100) + "%";

  if (!narration.paused && !narration.ended) {
    requestAnimationFrame(update);
  }
}

startButton.addEventListener("click", async () => {

  if (started) return;

  try {

    started = true;

    startButton.classList.add("hidden");
    soundToggle.hidden = false;

    narration.currentTime = 0;

    /* ДИКТОРДУН ҮНҮ — 100% */
    narration.volume = 1;

    /* МУЗЫКА — 6% */
    music.volume = 0.06;

    await narration.play();

    music.play().catch(() => {
      console.log("Музыка иштетилген жок");
    });

    showSlide(0);

    requestAnimationFrame(update);

  } catch (error) {

    started = false;

    startButton.classList.remove("hidden");

    alert("Үн ачылган жок. Дагы бир жолу басып көрүңүз.");

  }

});

soundToggle.addEventListener("click", () => {

  const muted = !narration.muted;

  narration.muted = muted;
  music.muted = muted;

  soundToggle.textContent = muted ? "×" : "♫";

});

narration.addEventListener("ended", () => {

  panel.classList.remove("show");

  progressBar.style.width = "100%";

  music.pause();

  soundToggle.hidden = true;

});

</script>

</body>
</html>
