<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Айдана | Кыз узатуу</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: white;
    font-family: 'Manrope', sans-serif;
}

.invitation {
    position: relative;
    width: 100%;
    max-width: 560px;
    height: 100vh;
    height: 100svh;
    min-height: 600px;
    margin: auto;
    overflow: hidden;
    background: #080808;
}

.photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-repeat: no-repeat;
    opacity: 0;
    transform: scale(1.02);
    transition: opacity 1.8s ease, transform 8s ease;
}

.photo.active {
    opacity: 1;
    transform: scale(1.08);
}

.photo-one {
    background-image: url("./C324E1C4-7ACD-416E-8458-CB22A9206F98.png");
    background-position: center 35%;
}

.photo-two {
    background-image: url("./IMG_7451.jpeg");
    background-position: center 35%;
}

.overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.12),
        rgba(0,0,0,0.05) 35%,
        rgba(0,0,0,0.65)
    );
}

.top-label {
    position: absolute;
    top: 35px;
    left: 15px;
    right: 15px;
    text-align: center;
    color: #d8c29a;
    font-size: 10px;
    letter-spacing: 4px;
}

.panel {
    position: absolute;
    left: 6%;
    right: 6%;
    bottom: 14%;
    padding: 24px 19px;
    text-align: center;
    background: rgba(0,0,0,0.70);
    border: 1px solid rgba(216,194,154,0.55);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    transition: opacity 0.7s ease, transform 0.7s ease;
}

.panel.fade {
    opacity: 0;
    transform: translateY(12px);
}

.gold-line {
    width: 42px;
    height: 1px;
    background: #d8c29a;
    margin: 0 auto 15px;
}

.eyebrow {
    color: #d8c29a;
    font-size: 9px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(29px, 7vw, 38px);
    font-weight: 500;
    margin-bottom: 12px;
}

.description {
    font-size: clamp(13px, 3.5vw, 16px);
    line-height: 1.65;
    color: #fffaf1;
}

.name {
    margin-top: 17px;
    color: #d8c29a;
    font-size: 10px;
    letter-spacing: 5px;
}

.start-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 15px 25px;
    border: 1px solid #d8c29a;
    border-radius: 40px;
    background: rgba(0,0,0,0.85);
    color: white;
    font-size: 13px;
    letter-spacing: 1px;
    white-space: nowrap;
    z-index: 5;
}

.start-button.hidden {
    display: none;
}

.sound-button {
    position: absolute;
    top: 25px;
    right: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #d8c29a;
    background: rgba(0,0,0,0.7);
    color: white;
    font-size: 17px;
    z-index: 5;
}

.progress {
    position: absolute;
    bottom: 30px;
    left: 10%;
    right: 10%;
    height: 2px;
    background: rgba(255,255,255,0.25);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #d8c29a;
    transition: width 0.3s linear;
}

.footer {
    position: absolute;
    bottom: 48px;
    left: 5%;
    right: 5%;
    text-align: center;
    font-size: 8px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.7);
}

@media (max-height: 700px) {
    .panel {
        bottom: 12%;
        padding: 17px;
    }

    .description {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<main class="invitation">

    <div class="photo photo-one active" id="photoOne"></div>
    <div class="photo photo-two" id="photoTwo"></div>

    <div class="overlay"></div>

    <div class="top-label">
        АК ТИЛЕК • АК БАТА • АК ЖОЛ
    </div>

    <section class="panel" id="panel">
        <div class="gold-line"></div>

        <p class="eyebrow" id="eyebrow">
            КЫЗ УЗАТУУ САЛТАНАТЫ
        </p>

        <h1 class="title" id="title">Ак тилек</h1>

        <p class="description" id="description">
            Кыз узатуу — ак баталар айтылып, жакшы тилектер арналып, жаңы жашоого ак жол кааланган өзгөчө күн.
            Айдананын кадамы куттуу, келечеги кең, бактысы түбөлүктүү болсун!
        </p>

        <div class="name">АЙДАНА</div>
    </section>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <button class="start-button" id="startButton">
        ▶ ҮН МЕНЕН КӨРҮҮ
    </button>

    <button class="sound-button" id="soundButton" hidden>
        ♫
    </button>

    <div class="footer">
        СИЗДЕРДИ КУБАНЫЧЫБЫЗГА ОРТОКТОШ БОЛУУГА ЧАКЫРАБЫЗ
    </div>

    <audio id="narration"
    src="./ElevenLabs_Untitled_project.mp3"
    preload="auto"></audio>

    <audio id="music"
    src="./kyz_uzatuu_music.mp3"
    preload="auto"
    loop></audio>

</main>

<script>
const narration = document.getElementById("narration");
const music = document.getElementById("music");

const panel = document.getElementById("panel");
const title = document.getElementById("title");
const description = document.getElementById("description");
const eyebrow = document.getElementById("eyebrow");

const progressBar = document.getElementById("progressBar");
const startButton = document.getElementById("startButton");
const soundButton = document.getElementById("soundButton");

const photoOne = document.getElementById("photoOne");
const photoTwo = document.getElementById("photoTwo");

const slides = [
{
title: "Ак тилек",
text: "Кыз узатуу — ак баталар айтылып, жакшы тилектер арналып, жаңы жашоого ак жол кааланган өзгөчө күн. Айдананын кадамы куттуу, келечеги кең, бактысы түбөлүктүү болсун!"
},
{
title: "Сиздерди чакырабыз",
text: "Ардактуу туугандар, кадырлуу коноктор! Сиздерди сүйүктүү кызыбыз Айдананын кыз узатуу салтанатына чакырабыз! Кубанычыбызга ортоктош болуп, ак тилектериңиздер менен бөлүшүп кетүүгө чакырабыз!"
},
{
title: "Өтүүчү дарек",
text: "Салтанат Каракол шаарында өтөт."
},
{
title: "Ресторан",
text: "«СОНО» рестораны."
},
{
title: "Күнү жана убактысы",
text: "2027-жыл, 3-март. Башталышы саат 15:00дө."
},
{
title: "Той ээлери",
text: "Муратбек жана Гүлгаакы сиздерди ак дасторконубуздун төрүнөн орун алып, кубанычыбызга ортоктош болууга чыдамсыздык менен күтөт!"
}
];

let currentSlide = -1;
let photoState = false;
let photoInterval;
let slideTimeout;
let started = false;

function showSlide(index) {
    if (index === currentSlide) return;

    currentSlide = index;
    const slide = slides[index];

    panel.classList.add("fade");

    clearTimeout(slideTimeout);

    slideTimeout = setTimeout(() => {
        title.textContent = slide.title;
        description.textContent = slide.text;
        eyebrow.textContent = "АЙДАНАНЫН КЫЗ УЗАТУУСУ";
        panel.classList.remove("fade");
    }, 350);
}

function changePhoto() {
    photoState = !photoState;

    photoOne.classList.toggle("active", !photoState);
    photoTwo.classList.toggle("active", photoState);
}

function updateSlides() {
    if (!narration.duration || !isFinite(narration.duration)) return;

    const time = narration.currentTime;
    const duration = narration.duration;

    const progress = time / duration * 100;
    progressBar.style.width = progress + "%";

    const index = Math.min(
        slides.length - 1,
        Math.floor((time / duration) * slides.length)
    );

    showSlide(index);
}

async function startInvitation() {
    if (started) {
        narration.currentTime = 0;
    }

    try {
        await narration.play();
        started = true;

        music.volume = 0.20;
        music.play().catch(() => {});

        startButton.classList.add("hidden");
        soundButton.hidden = false;

        clearInterval(photoInterval);
        photoInterval = setInterval(changePhoto, 7500);

    } catch (error) {
        alert("Диктордун үнү ачылган жок. Аудио файлдын атын текшерүү керек.");
    }
}

startButton.addEventListener("click", startInvitation);

soundButton.addEventListener("click", () => {
    if (narration.paused) {
        narration.play();
        music.play().catch(() => {});
        soundButton.textContent = "♫";
    } else {
        narration.pause();
        music.pause();
        soundButton.textContent = "▶";
    }
});

narration.addEventListener("timeupdate", updateSlides);

narration.addEventListener("ended", () => {
    clearInterval(photoInterval);

    title.textContent = "Ак тилек менен";
    description.textContent =
        "Кубанычыбызга ортоктош болгонуңуздар үчүн чоң рахмат!";

    eyebrow.textContent = "АЙДАНА";

    progressBar.style.width = "100%";

    music.pause();
    music.currentTime = 0;

    soundButton.hidden = true;

    startButton.textContent = "↻ КАЙРА КӨРҮҮ";
    startButton.classList.remove("hidden");
});

</script>

</body>
</html>
